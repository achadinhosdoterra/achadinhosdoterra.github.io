name: Postar no TikTok automaticamente

on:
  schedule:
    - cron: "30 10,14,18,22 * * *" # 7h30, 11h30, 15h30, 19h30 America/Sao_Paulo (UTC-3)
  workflow_dispatch: {}

concurrency:
  group: postar-tiktok
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  postar-tiktok:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Gerar imagem (e video, se necessario) hospedados do produto
        run: python publicar_automatico.py --tipo=tiktok --preparar

      - name: Commit e push da imagem/video gerado
        run: |
          git config user.name "Achadinhos Bot"
          git config user.email "achadinhos@achadinhosdoterra.local"
          git add imagens_geradas
          [ -d videos_gerados ] && git add videos_gerados
          git diff --cached --quiet && echo "Sem mudancas" && exit 0
          git commit -m "Gera imagem/video de tiktok - $(date +'%d/%m/%Y %H:%M')"
          for tentativa in 1 2 3 4 5; do
            git push && exit 0
            echo "push falhou (tentativa $tentativa), sincronizando com origin/main..."
            git pull --rebase --autostash origin main
            sleep 5
          done
          echo "push falhou apos varias tentativas"
          exit 1

      - name: Aguardar propagacao do arquivo publico
        run: sleep 30

      - name: Publicar proximo produto no TikTok
        run: python publicar_automatico.py --tipo=tiktok --publicar

      - name: Regenerar site
        if: ${{ !cancelled() }}
        run: python gerar_site.py

      - name: Commit e push do registro
        if: ${{ !cancelled() }}
        run: |
          git config user.name "Achadinhos Bot"
          git config user.email "achadinhos@achadinhosdoterra.local"
          git add publicados.csv docs/index.html
          git diff --cached --quiet && echo "Sem mudancas" && exit 0
          git commit -m "Post automatico no tiktok - $(date +'%d/%m/%Y %H:%M')"
          for tentativa in 1 2 3 4 5; do
            git push && exit 0
            echo "push falhou (tentativa $tentativa), sincronizando com origin/main..."
            git pull --rebase --autostash origin main
            sleep 5
          done
          echo "push falhou apos varias tentativas - risco de post duplicado no proximo ciclo!"
          exit 1
